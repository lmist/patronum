formula = "bootstrap-beads"
description = "Make beads work in this checkout. Idempotent: observe, then apply the matching resolver row."
version = 1
type = "workflow"

[vars.prefix]
description = "Issue prefix for bd init"
default = "pt"

[[steps]]
id = "observe"
title = "Observe checkout state"
type = "task"
priority = 1
labels = ["bootstrap"]
description = """
Print the observation block (git? mise? bin/bd? .beads/metadata.json? formulas? hooks?).
Use docs/RESOLVERS.md section 0. Do not change anything in this step.
Acceptance: a note on this bead lists yes/no for each of those six facts.
"""

[[steps]]
id = "build-binary"
title = "Ensure repo-local bin/bd"
type = "chore"
priority = 1
labels = ["bootstrap"]
needs = ["observe"]
description = """
Resolver: if bin/bd is executable and `bin/bd version` starts with 1.2, close as done.
Else `make bd`: mise installs the pinned release and bin/bd is linked to it. It needs mise on PATH.
Acceptance: `./bin/bd version` reports 1.2.x, installed by mise.
"""

[[steps]]
id = "init-database"
title = "Ensure beads database prefix={{prefix}}"
type = "chore"
priority = 1
labels = ["bootstrap"]
needs = ["build-binary"]
description = """
Resolver: if .beads/metadata.json exists, run `bd bootstrap --yes` and close.
Else BD_NON_INTERACTIVE=1 ./bin/bd init --non-interactive --role maintainer -p {{prefix}} --skip-agents.
Never bd init --force on a checkout that already has issues.
Acceptance: `bd info` shows prefix {{prefix}} and a working embedded Dolt db.
"""

[[steps]]
id = "install-hooks"
title = "Install beads hooks plus patronum extras"
type = "chore"
priority = 1
labels = ["bootstrap"]
needs = ["init-database"]
description = """
make hooks
Acceptance: core.hooksPath points at .beads/hooks; pre-commit contains PATRONUM PATH and CHECKS markers.
"""

[[steps]]
id = "install-formulas"
title = "Verify pourable formulas parse"
type = "chore"
priority = 1
labels = ["bootstrap"]
needs = ["init-database"]
description = """
./scripts/check-formulas.sh
Acceptance: every .beads/formulas/*.formula.toml is visible to `bd formula show --json` with a non-zero step count.
"""

[[steps]]
id = "write-resolvers"
title = "Agent docs point at resolver tables"
type = "task"
priority = 1
labels = ["bootstrap"]
needs = ["init-database"]
description = """
Acceptance: AGENTS.md, AGENT_INSTRUCTIONS.md, and docs/RESOLVERS.md exist and describe observe-then-lookup, not a linear prompt.
"""

[[steps]]
id = "verify"
title = "Verify beads is usable"
type = "task"
priority = 1
labels = ["bootstrap"]
needs = ["install-hooks", "install-formulas", "write-resolvers"]
description = """
export PATH="$PWD/bin:$PATH"
bd types
bd formula list
bd ready
make doctor
Acceptance: an agent can claim ready work without guessing which bd binary to run.
"""
