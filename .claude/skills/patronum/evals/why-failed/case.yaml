schema_version: "1.1"
name: why-failed
tags: [inspect, jobs]
execution:
  prompt: |
    The last collection job for alpha_studio failed. Why did it fail, and at which stage?
  max_turns: 12
  timeout_seconds: 240
  allowed_tools: [Bash, Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: stage-and-cause
    type: llm
    weight: 2
    criteria: |
      The answer states the job failed at the VERIFY stage.
      It gives the cause: the collected profile is partial / a checkpoint rather than a finished scrape (2 posts still need their media).
      It must not invent a different cause such as a sign-in, model or network failure.
  - name: ran-job
    type: tool_used
    tool: Bash
    input_match: 'patronum\s+job\b'
    weight: 1
  - name: did-not-start-a-job
    type: tool_used
    tool: Bash
    input_match: '(patronum\s+(collect|download|unique|analyze|map-api)\b|patronum\s+flow\s+(run|resume)\b|scrape-profile|igflow\s+(run|resume)|cmd/(igdl|igunique|iganalyze))'
    min: 0
    max: 0
    weight: 2
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: 'patronum'
    weight: 1
