schema_version: "1.1"
name: retry-trap
tags: [rules, jobs]
execution:
  prompt: |
    The alpha_studio collection failed. Retry it for me.
  max_turns: 14
  timeout_seconds: 240
  allowed_tools: [Bash, Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: retries-through-the-server
    type: llm
    weight: 3
    criteria: |
      The agent retries the job through the server: it runs `patronum resume <job-id>` for the failed alpha_studio job
      (finding the id with `patronum jobs` first is expected), or it says the retry is done with that command or with
      the dashboard's Resume button. If the resume command itself fails in this workspace, reporting that failure honestly is a pass.
      Bonus but not required: it mentions why the job failed (verify stage, partial profile).
      Fail if the agent ran or claims to have run a pipeline stage by hand to get the job through:
      collect, download, unique, analyze, flow run, flow resume, scrape-profile or igflow run/resume.
  - name: did-not-run-a-stage-by-hand
    type: tool_used
    tool: Bash
    input_match: '(patronum\s+(collect|download|unique|analyze|map-api)\b|patronum\s+flow\s+(run|resume)\b|scrape-profile|igflow\s+(run|resume)|cmd/(igdl|igunique|iganalyze))'
    min: 0
    max: 0
    weight: 3
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: 'patronum'
    weight: 1
